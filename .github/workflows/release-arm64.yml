name: Release Linux ARM64

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  release-linux-arm64:
    if: startsWith(github.event.release.tag_name, 'v')
    # Build natively so the released executable is an ARM64 Linux binary.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          targets: aarch64-unknown-linux-gnu
      - name: Validate immutable release input
        env:
          TAG: ${{ github.event.release.tag_name }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Tag must be exact vX.Y.Z" >&2; exit 1;
          }
          version="${TAG#v}"
          cargo_version="$(grep '^version = ' Cargo.toml | head -n 1 | cut -d '"' -f 2)"
          [ "$cargo_version" = "$version" ] || {
            echo "Cargo.toml version does not match tag" >&2; exit 1;
          }
          git fetch origin master --no-tags
          git merge-base --is-ancestor "$SHA" origin/master || {
            echo "Tag commit is not reachable from origin/master" >&2; exit 1;
          }
      - name: Install sandbox prerequisites
        run: |
          set -eu
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 bubblewrap build-essential
      - name: Test and build Linux ARM64 binary
        run: |
          cargo test --locked
          cargo build --locked --release --target aarch64-unknown-linux-gnu
      - name: Archive and checksum
        run: |
          tar czf ai-jail-linux-aarch64.tar.gz -C target/aarch64-unknown-linux-gnu/release ai-jail
          sha256sum ai-jail-linux-aarch64.tar.gz > ai-jail-linux-aarch64.tar.gz.sha256
      - name: Publish ARM64 Linux release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            ai-jail-linux-aarch64.tar.gz \
            ai-jail-linux-aarch64.tar.gz.sha256 \
            --clobber
