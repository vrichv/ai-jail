name: Release Linux ARM64

on:
  release:
    types: [created]

permissions:
  contents: read

jobs:
  release-linux-arm64:
    if: startsWith(github.event.release.tag_name, 'v')
    # Build natively so the released executable is an ARM64 Linux binary.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          targets: aarch64-unknown-linux-gnu
      - name: Validate immutable release input
        env:
          TAG: ${{ github.event.release.tag_name }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Tag must be exact vX.Y.Z" >&2; exit 1;
          }
          version="${TAG#v}"
          cargo_version="$(grep '^version = ' Cargo.toml | head -n 1 | cut -d '"' -f 2)"
          [ "$cargo_version" = "$version" ] || {
            echo "Cargo.toml version does not match tag" >&2; exit 1;
          }
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git cat-file -e "${TAG}^{tag}" 2>/dev/null || {
            echo "Lightweight tag refused" >&2; exit 1;
          }
          git fetch origin master --no-tags
          git merge-base --is-ancestor "$SHA" origin/master || {
            echo "Tag commit is not reachable from origin/master" >&2; exit 1;
          }
          keyring_home="$(mktemp -d)"
          trap 'rm -rf "$keyring_home" verify-tag.log' EXIT
          export GNUPGHOME="$keyring_home"
          for key in .github/release-keyring/*.asc .github/release-keyring/*.gpg; do
            [ -f "$key" ] || continue
            gpg --batch --import "$key" >/dev/null 2>&1 || {
              echo "Failed to import release key: $key" >&2; exit 1;
            }
          done
          [ -s .github/release-keyring/fingerprints.txt ] || {
            echo ".github/release-keyring/fingerprints.txt is required" >&2; exit 1;
          }
          git verify-tag -v "$TAG" >verify-tag.log 2>&1 || {
            cat verify-tag.log >&2; exit 1;
          }
          signer_fp="$(sed -n 's/^[[:space:]]*Primary key fingerprint:[[:space:]]*//p' verify-tag.log | head -n 1 | tr -d ' ' | tr '[:lower:]' '[:upper:]')"
          [ -n "$signer_fp" ] || {
            echo "No primary key fingerprint in tag verification output" >&2; exit 1;
          }
          grep -Ev '^[[:space:]]*(#|$)' .github/release-keyring/fingerprints.txt |
            tr -d ' \t' | tr '[:lower:]' '[:upper:]' |
            grep -qx "$signer_fp" || {
              echo "Tag signer is not pinned in .github/release-keyring/fingerprints.txt" >&2; exit 1;
            }
      - name: Install sandbox prerequisites
        run: |
          set -eu
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y -o Acquire::Retries=3 bubblewrap build-essential
      - name: Test and build Linux ARM64 binary
        run: |
          cargo test --locked
          cargo build --locked --release --target aarch64-unknown-linux-gnu
      - name: Archive and checksum
        run: |
          tar czf ai-jail-linux-aarch64.tar.gz -C target/aarch64-unknown-linux-gnu/release ai-jail
          sha256sum ai-jail-linux-aarch64.tar.gz > ai-jail-linux-aarch64.tar.gz.sha256
      - name: Publish ARM64 Linux release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$TAG" \
            ai-jail-linux-aarch64.tar.gz \
            ai-jail-linux-aarch64.tar.gz.sha256 \
            --clobber
