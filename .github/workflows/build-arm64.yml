name: Build upstream ARM64 release

on:
  schedule:
    - cron: '0 0 * * *' # Daily at 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-arm64-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Check upstream latest release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          DEST_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$(gh api repos/akitaonrails/ai-jail/releases/latest --jq '.tag_name')"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Unexpected upstream tag: $tag" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh api "repos/$DEST_REPO/releases/tags/$tag" >/dev/null 2>&1; then
            echo "Latest upstream release $tag already exists locally; skipping."
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        if: steps.latest.outputs.build == 'true'
        with:
          repository: akitaonrails/ai-jail
          ref: ${{ steps.latest.outputs.tag }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        if: steps.latest.outputs.build == 'true'
        with:
          toolchain: 1.97.1
          targets: aarch64-unknown-linux-gnu
      - name: Build and package Linux ARM64
        if: steps.latest.outputs.build == 'true'
        run: |
          set -euo pipefail
          cargo build --locked --release --target aarch64-unknown-linux-gnu
          tar czf ai-jail-linux-aarch64.tar.gz -C target/aarch64-unknown-linux-gnu/release ai-jail
          sha256sum ai-jail-linux-aarch64.tar.gz > ai-jail-linux-aarch64.tar.gz.sha256
      - name: Publish to this repository
        if: steps.latest.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.latest.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" ai-jail-linux-aarch64.tar.gz ai-jail-linux-aarch64.tar.gz.sha256 \
            --title "$TAG (Linux ARM64)" \
            --notes "Built from akitaonrails/ai-jail release $TAG." \
            --target "$GITHUB_SHA"
